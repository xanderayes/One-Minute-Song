<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sequence Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 24px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .sequence {
            font-size: 24px;
            color: #333;
            font-weight: 600;
            word-wrap: break-word;
        }

        .sum {
            margin-top: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Sequence Generator</h1>
        
        <div class="input-group">
            <label for="targetNumber">Enter a target number:</label>
            <input type="number" id="targetNumber" placeholder="e.g., 100" min="2">
            <div class="error" id="errorMessage">Please enter a valid integer (minimum 2)</div>
        </div>

        <button onclick="generateSequence()">Generate Sequence</button>

        <div class="result" id="result">
            <div class="result-label">Random sequence:</div>
            <div class="sequence" id="sequence"></div>
            <div class="sum" id="sum"></div>
            <div class="result-label" style="margin-top: 16px;">Parts:</div>
            <div class="sequence" id="parts"></div>
            <div class="result-label" style="margin-top: 16px;">Bars:</div>
            <div class="sequence" id="bars"></div>
        </div>
    </div>

    <script>
        function generateSequence() {
            const input = document.getElementById('targetNumber');
            const errorDiv = document.getElementById('errorMessage');
            const resultDiv = document.getElementById('result');
            const sequenceDiv = document.getElementById('sequence');
            const sumDiv = document.getElementById('sum');
            const partsDiv = document.getElementById('parts');
            const barsDiv = document.getElementById('bars');

            const target = parseInt(input.value);

            // Validation
            if (isNaN(target) || target < 2) {
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
                return;
            }

            errorDiv.classList.remove('show');
            errorDiv.textContent = 'Please enter a valid integer (minimum 2)';

            // Generate random sequence
            const sequence = generateRandomSequence(target);

            if (!sequence) {
                errorDiv.textContent = 'Target too small for the constraints';
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
                return;
            }

            // Display results
            sequenceDiv.textContent = sequence.map(formatNumber).join(' + ');
            sumDiv.textContent = `= ${sequence.reduce((a, b) => a + b, 0)}`;

            // Display parts with letters
            const uniqueNumbers = [...new Set(sequence)];
            const letterMap = {};
            uniqueNumbers.forEach((num, index) => {
                letterMap[num] = String.fromCharCode(65 + index); // A, B, C, ...
            });
            partsDiv.textContent = sequence.map(num => letterMap[num]).join(' ');

            // Display bars
            barsDiv.textContent = sequence.map(formatBar).join(' + ');

            resultDiv.classList.add('show');
        }

        function formatNumber(num) {
            if (num > 7) {
                const fours = Math.floor(num / 4);
                const remainder = num - (fours * 4);
                if (remainder === 0) {
                    return `(${fours} * 4)`;
                } else {
                    return `(${fours} * 4 + ${remainder})`;
                }
            }
            return num.toString();
        }

        function formatBar(num) {
            if (num > 7) {
                const fours = Math.floor(num / 4);
                const remainder = num - (fours * 4);
                const remainderFraction = formatToFraction(remainder);
                if (remainder === 0) {
                    return `(${fours} * 4/4)`;
                } else {
                    return `(${fours} * 4/4 + ${remainderFraction})`;
                }
            }
            return formatToFraction(num);
        }

        function formatToFraction(num) {
            // Convert to eighths: multiply by 2, denominator is 8
            const numerator = Math.round(num * 2);
            const denominator = 8;

            // Simplify the fraction
            const gcd = findGCD(numerator, denominator);
            const simplifiedNum = numerator / gcd;
            const simplifiedDen = denominator / gcd;

            return `${simplifiedNum}/${simplifiedDen}`;
        }

        function findGCD(a, b) {
            return b === 0 ? a : findGCD(b, a % b);
        }

        function generateRandomSequence(target) {
            // Validate target is at least 1.5
            if (target < 1.5) {
                return null;
            }

            // Try to generate a valid sequence
            let maxAttempts = 100;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const result = tryGenerateSequence(target);
                if (result) return result;
            }
            
            // Fallback: simple sequence if all attempts fail
            return [target];
        }

        function tryGenerateSequence(target) {
            // Generate exactly 3 unique numbers (integers or halves)
            const uniqueNumbers = new Set();
            const maxVal = Math.max(0.5, target / 2);

            while (uniqueNumbers.size < 3) {
                // Generate a random number between 0.5 and maxVal
                const rawNum = Math.random() * (maxVal - 0.5) + 0.5;
                // Round to nearest 0.5
                const roundedNum = Math.round(rawNum * 2) / 2;
                uniqueNumbers.add(roundedNum);
            }

            const numbers = Array.from(uniqueNumbers);
            const minNumber = Math.min(...numbers);

            // Build sequence using only these 3 numbers, max 10 numbers total
            const sequence = [];
            let remaining = target;
            const maxNumbers = 10;

            while (remaining > 0) {
                // Check if we've reached max numbers
                if (sequence.length >= maxNumbers) {
                    return null; // Too many numbers
                }

                // Filter numbers that are <= remaining
                const validNumbers = numbers.filter(n => n <= remaining);

                if (validNumbers.length === 0) {
                    return null; // Failed to build sequence
                }

                // Pick a random valid number
                const chosen = validNumbers[Math.floor(Math.random() * validNumbers.length)];
                sequence.push(chosen);
                remaining -= chosen;

                // Prevent infinite loops with very small remaining
                if (remaining < minNumber && remaining > 0) {
                    // Try to adjust the last element
                    if (sequence.length > 0) {
                        const last = sequence.pop();
                        remaining += last;
                        // Use the exact remaining if it's a valid number
                        if (numbers.includes(remaining) || remaining === 0) {
                            if (remaining > 0) sequence.push(remaining);
                            remaining = 0;
                        } else {
                            return null;
                        }
                    } else {
                        return null;
                    }
                }
            }

            // Ensure we have at least 2 numbers if possible
            if (sequence.length === 1 && target >= minNumber * 2) {
                return null;
            }

            return sequence.length >= 2 ? sequence : null;
        }

        // Allow Enter key to trigger generation
        document.getElementById('targetNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateSequence();
            }
        });
    </script>
</body>
</html>
